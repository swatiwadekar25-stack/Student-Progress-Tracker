
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Student Progress Tracker</h1>
        <p class="subtitle">Add and track student course progress</p>

        <form id="progressForm">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name" required>

            <label for="courseName">Course Name</label>
            <input type="text" id="courseName"
                   placeholder="Enter course name" required>

            <label for="completionPercentage">Completion Percentage</label>
            <input type="number" id="completionPercentage"
                   placeholder="0 - 100" min="0" max="100" required>

            <button type="submit" id="submitButton">Add Progress</button>
        </form>

        <p id="responseMessage" role="status"></p>

        <a href="progress.html" class="view-progress">
            View Progress
        </a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Progress Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Student Progress Tracker</h1>

        <p class="subtitle">
            Add and track student course progress
        </p>


        <!-- Progress Form -->

        <form id="progressForm">

            <div class="form-group">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="courseName">
                    Course Name
                </label>

                <input
                    type="text"
                    id="courseName"
                    placeholder="Enter course name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="completionPercentage">
                    Completion Percentage
                </label>

                <input
                    type="number"
                    id="completionPercentage"
                    placeholder="0 - 100"
                    min="0"
                    max="100"
                    required
                >

            </div>


            <button type="submit">
                Add Progress
            </button>

    
        </form>


        <p id="responseMessage"></p><a href="progress.html" class="view-progress">
         View Progress
        </a>

    


       

    </div>


    <script src="script.js"></script>

</body>

</html>
